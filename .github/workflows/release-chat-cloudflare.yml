name: Release Chat Cloudflare manually

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly: originmind-public-chat-production:originmind-public-chat-production:chat.omindos.ai'
        required: true
        type: string

permissions:
  contents: read

jobs:
  reject-invalid-dispatch:
    if: >-
      github.repository != 'maganrobotics-boop/originmind-public-preview' ||
      github.ref != 'refs/heads/main' ||
      inputs.confirmation != 'originmind-public-chat-production:originmind-public-chat-production:chat.omindos.ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject unauthorized release
        run: exit 64

  release:
    if: >-
      github.repository == 'maganrobotics-boop/originmind-public-preview' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'originmind-public-chat-production:originmind-public-chat-production:chat.omindos.ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: originmind-public-chat-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OA_PRODUCTION_WORKER_NAME: originmind-internal-oa-staging
      PUBLIC_LAB_AI_SERVICE_TOKEN: ${{ secrets.PUBLIC_LAB_AI_SERVICE_TOKEN }}
      CHAT_ADMIN_EMAIL: administrator@omindos.ai
      CHAT_ADMIN_PASSWORD: ${{ secrets.CHAT_ADMIN_PASSWORD }}
      CHAT_APP_ENCRYPTION_KEY: ${{ secrets.CHAT_APP_ENCRYPTION_KEY }}
      CHAT_RATE_LIMIT_HMAC_KEY: ${{ secrets.CHAT_RATE_LIMIT_HMAC_KEY }}
      CHAT_RELEASE_CONFIRM: ${{ inputs.confirmation }}
      CHAT_RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}
      PUBLIC_ALLOWED_ORIGINS: https://maganrobotics-boop.github.io
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check frontend and Worker syntax
        run: |
          node --check src/index.mjs
          npm run check:frontend
      - name: Release to Cloudflare
        run: node scripts/release-cloudflare.mjs
