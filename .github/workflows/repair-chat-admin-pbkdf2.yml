name: Repair Chat administrator PBKDF2 manually

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type exactly: originmind-public-chat-production:repair-cloudflare-pbkdf2:chat.omindos.ai'
        required: true
        type: string

permissions:
  contents: read

jobs:
  reject-invalid-dispatch:
    if: >-
      github.repository != 'maganrobotics-boop/originmind-oa' ||
      github.ref != 'refs/heads/main' ||
      inputs.confirmation != 'originmind-public-chat-production:repair-cloudflare-pbkdf2:chat.omindos.ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Reject an unauthorized administrator password repair
        run: exit 64

  repair:
    if: >-
      github.repository == 'maganrobotics-boop/originmind-oa' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'originmind-public-chat-production:repair-cloudflare-pbkdf2:chat.omindos.ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production-oa
      url: https://chat.omindos.ai/manage
    concurrency:
      group: chat-cloudflare-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.OA_PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
      CHAT_ADMIN_OPERATION: repair-cloudflare-pbkdf2
      CHAT_ADMIN_INITIALIZATION_CONFIRM: ${{ inputs.confirmation }}
      WRANGLER_LOG_SANITIZE: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CI: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: chat-cloudflare/package-lock.json
      - name: Install locked Chat dependencies
        run: npm ci --prefix chat-cloudflare
      - name: Check the Chat Worker and administrator repair controls
        run: |
          npm --prefix chat-cloudflare run check
          node --test chat-cloudflare/scripts/*.test.mjs
      - name: Prepare and persist the pre-mutation D1 recovery bookmark
        env:
          CHAT_ADMIN_OPERATION: prepare-cloudflare-pbkdf2
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node chat-cloudflare/scripts/initialize-admin.mjs
      - name: Externalize the D1 recovery bookmark before mutation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-admin-pbkdf2-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: chat-cloudflare/.wrangler/admin-initialization/repair-checkpoint.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Remove only the non-mutating preparation receipt
        run: node -e "require('node:fs').unlinkSync('chat-cloudflare/.wrangler/admin-initialization/receipt.json')"
      - name: Repair only the incompatible production administrator password record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHAT_ADMIN_PASSWORD: ${{ secrets.CHAT_ADMIN_PASSWORD }}
        run: node chat-cloudflare/scripts/initialize-admin.mjs
      - name: Verify the saved production administrator password and revoke the smoke session
        env:
          CHAT_ADMIN_PASSWORD: ${{ secrets.CHAT_ADMIN_PASSWORD }}
        run: node chat-cloudflare/scripts/smoke-cloudflare.mjs https://chat.omindos.ai --admin-saved-secret
      - name: Preserve non-secret repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-admin-pbkdf2-repair-${{ github.sha }}-${{ github.run_attempt }}
          path: chat-cloudflare/.wrangler/admin-initialization/*.json
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
