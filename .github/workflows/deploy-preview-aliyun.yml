name: Deploy Preview Frontend to Aliyun manually

on:
  workflow_dispatch:
    inputs:
      aliyun_host:
        description: 'Aliyun server public IP or hostname'
        required: true
        default: '39.108.50.65'
        type: string
      aliyun_user:
        description: 'SSH username'
        required: true
        default: 'root'
        type: string
      server_password:
        description: 'SSH password, used once by this workflow run'
        required: true
        type: string
      deploy_mode:
        description: 'preview temporarily serves preview on the IP root; restore brings previous Nginx configs back'
        required: true
        default: 'preview'
        type: choice
        options:
          - 'preview'
          - 'restore'
      deploy_path:
        description: 'Remote static frontend path'
        required: true
        default: '/var/www/originmind-preview'
        type: string
      server_name:
        description: 'Optional hostname for port 80 access'
        required: true
        default: 'preview.omindos.cn'
        type: string
      api_upstream:
        description: 'Cloudflare Worker origin that keeps using the existing data/API'
        required: true
        default: 'https://preview.omindos.ai'
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: originmind-preview-aliyun
      cancel-in-progress: false
    env:
      ALIYUN_HOST: ${{ inputs.aliyun_host }}
      ALIYUN_USER: ${{ inputs.aliyun_user }}
      ALIYUN_PASSWORD: ${{ inputs.server_password }}
      DEPLOY_MODE: ${{ inputs.deploy_mode }}
      DEPLOY_PATH: ${{ inputs.deploy_path }}
      SERVER_NAME: ${{ inputs.server_name }}
      API_UPSTREAM: ${{ inputs.api_upstream }}
      CI: '1'
    steps:
      - name: Mask password
        run: echo "::add-mask::$ALIYUN_PASSWORD"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: inputs.deploy_mode == 'preview'
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: inputs.deploy_mode == 'preview'
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        if: inputs.deploy_mode == 'preview'
        run: npm ci

      - name: Build static frontend
        if: inputs.deploy_mode == 'preview'
        run: npm run build:frontend

      - name: Point static frontend at existing Cloudflare API
        if: inputs.deploy_mode == 'preview'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const apiBase = process.env.API_UPSTREAM.replace(/\/+$/u, '');
          if (!/^https:\/\/[A-Za-z0-9.-]+(?::[0-9]+)?$/u.test(apiBase)) {
            throw new Error('api_upstream must be an https origin, for example https://preview.omindos.ai');
          }
          const path = 'public/index.html';
          const html = await readFile(path, 'utf8');
          const marker = '<script type="module" src="/assets/';
          if (!html.includes(marker)) throw new Error('Cannot find frontend module script marker');
          const config = `<script>window.PUBLIC_API_BASE=${JSON.stringify(apiBase)};</script>\n    `;
          await writeFile(path, html.replace(marker, `${config}${marker}`));
          NODE

      - name: Package static frontend
        if: inputs.deploy_mode == 'preview'
        run: tar -C public -czf /tmp/originmind-preview-public.tgz .

      - name: Install SSH password helper
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Upload preview frontend to Aliyun
        if: inputs.deploy_mode == 'preview'
        run: |
          set -euo pipefail
          sshpass -p "$ALIYUN_PASSWORD" ssh -o StrictHostKeyChecking=accept-new "$ALIYUN_USER@$ALIYUN_HOST" 'mkdir -p /tmp/originmind-preview-deploy'
          sshpass -p "$ALIYUN_PASSWORD" scp -o StrictHostKeyChecking=accept-new /tmp/originmind-preview-public.tgz "$ALIYUN_USER@$ALIYUN_HOST:/tmp/originmind-preview-deploy/public.tgz"

      - name: Apply Aliyun preview or restore
        run: |
          set -euo pipefail
          sshpass -p "$ALIYUN_PASSWORD" ssh -o StrictHostKeyChecking=accept-new "$ALIYUN_USER@$ALIYUN_HOST" \
            "DEPLOY_MODE='$DEPLOY_MODE' DEPLOY_PATH='$DEPLOY_PATH' SERVER_NAME='$SERVER_NAME' API_UPSTREAM='$API_UPSTREAM' bash -s" <<'REMOTE'
          set -euo pipefail
          BACKUP_DIR=/etc/nginx/originmind-preview-backup
          DISABLED_DIR=/etc/nginx/originmind-preview-disabled

          if ! command -v nginx >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y nginx
            elif command -v yum >/dev/null 2>&1; then
              yum install -y nginx
            else
              echo 'nginx is required but no supported package manager was found' >&2
              exit 1
            fi
          fi

          if [ "$DEPLOY_MODE" = "restore" ]; then
            rm -f /etc/nginx/conf.d/000-originmind-preview-default.conf /etc/nginx/conf.d/originmind-preview.conf
            if [ -d "$DISABLED_DIR/conf.d" ]; then
              find "$DISABLED_DIR/conf.d" -type f -name '*.conf' -exec mv -f {} /etc/nginx/conf.d/ \;
            fi
            if [ -d "$DISABLED_DIR/sites-enabled" ]; then
              mkdir -p /etc/nginx/sites-enabled
              find "$DISABLED_DIR/sites-enabled" -mindepth 1 -maxdepth 1 -exec mv -f {} /etc/nginx/sites-enabled/ \;
            fi
            nginx -t
            systemctl reload nginx || systemctl restart nginx
            echo 'Restored previous Nginx site configs.'
            exit 0
          fi

          mkdir -p "$DEPLOY_PATH" "$BACKUP_DIR" "$DISABLED_DIR/conf.d" "$DISABLED_DIR/sites-enabled"
          rm -rf "${DEPLOY_PATH:?}/"*
          tar -xzf /tmp/originmind-preview-deploy/public.tgz -C "$DEPLOY_PATH"
          chown -R root:root "$DEPLOY_PATH"

          cp -a /etc/nginx/conf.d "$BACKUP_DIR/conf.d.$(date +%Y%m%d%H%M%S)" 2>/dev/null || true
          cp -a /etc/nginx/sites-enabled "$BACKUP_DIR/sites-enabled.$(date +%Y%m%d%H%M%S)" 2>/dev/null || true
          find /etc/nginx/conf.d -maxdepth 1 -type f -name '*.conf' ! -name '000-originmind-preview-default.conf' -exec mv -f {} "$DISABLED_DIR/conf.d/" \; 2>/dev/null || true
          if [ -d /etc/nginx/sites-enabled ]; then
            find /etc/nginx/sites-enabled -mindepth 1 -maxdepth 1 -exec mv -f {} "$DISABLED_DIR/sites-enabled/" \; 2>/dev/null || true
          fi

          cat >/etc/nginx/conf.d/000-originmind-preview-default.conf <<NGINX
          server {
              listen 80 default_server;
              server_name _;
              root ${DEPLOY_PATH};
              index index.html;

              location /api/ {
                  proxy_pass ${API_UPSTREAM}/api/;
                  proxy_ssl_server_name on;
                  proxy_set_header Host \$proxy_host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_http_version 1.1;
              }

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }
          NGINX

          if command -v ufw >/dev/null 2>&1; then ufw allow 80/tcp || true; fi
          if command -v firewall-cmd >/dev/null 2>&1; then firewall-cmd --permanent --add-port=80/tcp || true; firewall-cmd --reload || true; fi
          iptables -C INPUT -p tcp --dport 80 -j ACCEPT 2>/dev/null || iptables -I INPUT -p tcp --dport 80 -j ACCEPT || true

          nginx -t
          systemctl enable nginx >/dev/null 2>&1 || true
          systemctl reload nginx || systemctl restart nginx
          ss -lntp | grep ':80\b' || true
          curl -fsS --max-time 10 -o /dev/null http://127.0.0.1/
          REMOTE

      - name: Smoke test public Aliyun IP root
        if: inputs.deploy_mode == 'preview'
        run: |
          set -euo pipefail
          if curl -fsS --max-time 10 -o /dev/null "http://$ALIYUN_HOST/"; then
            echo 'Aliyun preview is reachable on public port 80.'
          else
            echo 'Aliyun preview deployed locally, but public port 80 was not reachable from GitHub.'
          fi
